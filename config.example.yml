# Database Configuration (SQLite)
db_path: ./data/bot.db

# ==============================================================================
# CONFIGURATION DU SERVEUR WEB & PROTECTION API / DASHBOARD
# ==============================================================================
web:
  port: 3000
  node_env: production
  # Protection de l'accès à l'API et au Webhook
  auth:
    enabled: false # Passer à true pour activer la protection par clé secrète
    api_key: "changez_cette_cle_secrete" # Clé API acceptée via header 'x-api-key', 'Authorization: Bearer <key>' ou '?api_key='
    protect_static: false # Si true, protège également l'accès aux pages HTML/statiques
    allowed_ips: [] # Liste blanche d'adresses IP autorisées (vide = toutes les adresses)

# Server Configuration (compatibilité directe)
port: 3000
node_env: production

# ==============================================================================
# CONFIGURATION DU PLANIFICATEUR DE TÂCHES (SCHEDULER / CRON)
# ==============================================================================
scheduler:
  enabled: true # Activer ou désactiver globalement le planificateur de tâches
  timezone: "Europe/Paris" # Fuseau horaire pour l'exécution des tâches cron
  tasks:
    # Tâche 1 : Vérification des rappels de bump Obsydian
    bump_reminders:
      enabled: true
      cron: "* * * * *" # Toutes les minutes
    # Tâche 2 : Prévisualisation du message du jour (envoyé la veille au soir à 21h)
    daily_preview:
      enabled: true
      cron: "0 21 * * *"
    # Tâche 3 : Publication automatique du message validé à 09h00
    daily_publish:
      enabled: true
      cron: "0 9 * * *"
    # Tâche 4 : Validation et publication automatique à 11h00 si non validé manuellement
    daily_autovalidate:
      enabled: true
      cron: "0 11 * * *"

# OpenRouter API Configuration
openrouter:
  api_key: "votre_cle_openrouter_ici"
  default_model: "openai/gpt-oss-20b:free"
  max_tokens: 500
  temperature: 0.7
  # Liste ordonnée de déclassement / fallback si le modèle principal échoue
  fallback_models:
    - "openai/gpt-oss-20b:free"
    - "meta-llama/llama-3.3-70b-instruct:free"
    - "google/gemini-2.0-flash-exp:free"
    - "mistralai/mistral-7b-instruct:free"
    - "qwen/qwen-2.5-72b-instruct:free"
    - "deepseek/deepseek-chat:free"
    - "nvidia/nemotron-3-ultra-550b-a55b:free"
  # Politique de retry avancée style Polly (.NET)
  retry_policy:
    enabled: true
    max_retries: 3           # Nombre de tentatives par modèle avant bascule sur le modèle de secours
    initial_delay_ms: 1000   # Délai initial en millisecondes
    backoff_factor: 2.0      # Facteur multiplicateur exponentiel
    max_delay_ms: 8000       # Délai maximal d'attente
    jitter: true             # Gigue aléatoire pour éviter les tempêtes de requêtes
    timeout_ms: 25000        # Timeout strict par requête
    retryable_statuses: [408, 429, 500, 502, 503, 504]

# ==============================================================================
# CONFIGURATION DISCORD & COMMANDES
# ==============================================================================
discord:
  token: "votre_discord_token_ici"
  client_id: "votre_client_id_ici"
  guild_id: "votre_guild_id_ici"
  default_color: "couleur_du_bot_dans_le_salon"

  # Protection & Permissions des Commandes Discord
  commands:
    enabled: true # Activer ou désactiver l'exécution des commandes
    # Rôles autorisés à exécuter des commandes (vide = tous les membres)
    allowed_roles: []
    # Utilisateurs autorisés à exécuter des commandes (IDs Discord, vide = tous)
    allowed_users: []
    # Salons autorisés pour exécuter des commandes (IDs Discord, vide = tous)
    allowed_channels: []
    # Permissions spécifiques par commande
    permissions:
      config:
        allowed_roles: []
        allowed_users: []
        allowed_channels: ["votre_salon_reserver"]
      confirm_member:
        allowed_roles: []
        allowed_users: []
        allowed_channels: []

# Notifications de démarrage
startup_notifier:
  enabled: true
  channel_id: "votre_salon_reserver"
  color: "couleur_du_bot_dans_le_salon"
  last_commit_sha: "" # À remplir avec le dernier commit sha du bot
  github:
    repo: "sinteam-bot/chienne-bot"
    token: ""

# Message du jour
