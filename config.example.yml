      - " tasse"
      - " verre"
      - " coucher"
      - " ambition"
      - " sérénité"
      - " tendresse"
      - " chaleur"
      - " café"
      - " thé"
      - " chocolat chaud"
      - " confiance"
      - " opportunité"
      - " fraicheur"
      - " oreiller"
      - " couette"
      - " cuisine"
      - " tartine"
      - " jus d’orange"
      - " amour"
      - " gorgée"

# CONFIGURATION DU SYSTÈME DE CAPTCHA
captcha:
  # Activer ou désactiver le système de captcha
  enabled: true
  # ID du canal où les captchas seront envoyés
  # Si non défini, un canal sera créé automatiquement
  channel_id: null
  # Nom du canal captcha à créer (si CAPTCHA_CHANNEL_ID est null)
  captcha_channel_name: "✅-verification-captcha"
  color: "couleur_du_bot_dans_le_salon"
  # ID du rôle à donner après validation du captcha
  verified_role_id: "votre_role_verifie"
  # Temps avant expiration du captcha (en minutes)
  captcha_timeout: 10
  # Nombre de tentatives autorisées
  max_attempts: 3
  # Configuration des questions mathématiques
  math_questions:
    min_number: 1
    max_number: 20
    # Types d'opérations possibles
    operations: ["+", "-", "*"]
    # Poids de chaque opération (pour la sélection aléatoire)
    operation_weights:
      - "+": 0.6
      - "-": 0.3
      - "*": 0.1
    # Messages
    messages:
      welcome_message: "Bienvenue sur le serveur ! Pour accéder au reste du serveur, tu dois résoudre ce captcha :"
      captcha_question: "Combien font {num1} {operator} {num2} ?"
      instructions: "Réponds avec le résultat **en chiffres** (exemple: 18) dans ce canal."
      success_message: "✅ Bravo ! Ta réponse est correcte. Tu as maintenant accès au serveur !"
      fail_message: "Mauvaise réponse, tu n'as plus que {attempts} tentative(s) <:Obsydemoncouverture:1488145689916473544>."
      timeout_message: "⏰ Temps écoulé ! Le captcha a expiré. Veuillez réessayer en rejoignant à nouveau le serveur."
      max_attempts_message: "❌ Trop de tentatives incorrectes. Veuillez quitter et rejoindre le serveur pour réessayer."
      already_verified: "✅ Tu as déjà été vérifié !"
    # Messages pour les logs
    log_messages:
      captcha_created: "🔒 Captcha créé pour {username} ({userId})"
      captcha_success: "✅ Captcha validé pour {username} ({userId})"
      captcha_failed: "❌ Captcha échoué pour {username} ({userId}) - Tentative {attempt}/{max}"
      captcha_timeout: "⏰ Captcha expiré pour {username} ({userId})"

# CONFIGURATION DU SYSTÈME D'ACCUEIL
welcome:
  enabled: true
  # Logs
  LOG_TO_CONSOLE: true
  # ID du channel où envoyer les messages de bienvenue
  channel_id: "votre_salon_accueil"
  # Nom du channel accueil à créer (si WELCOME_CHANNEL_ID est null)
  welcome_channel_name: "votre_salon_accueil"
  # Couleur du bot dans le salon accueil
  welcome_color: "couleur_du_bot_dans_le_salon"
  # IDs des rôles à attribuer automatiquement
  AUTO_ROLES: []

  # Message de bienvenue (peut contenir des variables)
  # {user} = mention de l'utilisateur
  # {username} = nom de l'utilisateur
  # {server} = nom du serveur
  # {memberCount} = nombre de membres
  welcome_message:
    enabled: true
    title: "🎉 Bienvenue sur {server} !"
    description: "Bienvenue {user} !\n\nNous sommes ravis de t'accueillir parmi nous ! 🎊"
    color: "#f2c7ce"
    footer: "Membre #{memberCount}"
    thumbnail: "user" # 'user' = avatar de l'utilisateur, ou URL d'une image
    image: null # URL d'une image de bannière (optionnel)
    fields:
      - name: "📚 Pour commencer"
        value: "• Lis les règles dans <#CHANNEL_REGLES_ID>\n• Présente-toi dans <#CHANNEL_PRESENTATION_ID>\n• N'hésite pas à poser des questions !"
        inline: false
      - name: "🎮 Commandes utiles"
        value: "`/help` - Liste des commandes\n`/rank` - Voir ton niveau"
        inline: true

  # Envoyer un message privé au nouveau membre
  dm_message:
    enabled: true
    title: "👋 Bienvenue !"
    description: "Salut {username} !\n\nBienvenue sur **{server}** ! Nous espérons que tu vas t'amuser avec nous. 😊"
    color: "#f2c7ce"
    fields:
      - name: "💡 Conseil"
        value: "N'oublie pas de te présenter pour que la communauté apprenne à te connaître !"
        inline: false

# Configuration du système XP
xp:
  enabled: false
  # XP par message
  message_xp:
    min: 15
    max: 25
    cooldown: 10 # Cooldown en secondes entre deux gains d'XP

  # XP vocal
  voice_xp:
    per_minute: 2 # XP par minute en vocal
    check_interval: 5 # Vérifier toutes les X minutes
    min_duration: 1 # Minimum de minutes pour gagner de l'XP

  # Formule de calcul de niveau
  level:
    base_xp: 100 # XP requis pour le niveau 1
    multiplier: 1.5 # Multiplicateur par niveau

  # Bonus
  bonus:
    daily_first_message: 50 # Bonus pour le premier message du jour
    streak_multiplier: 1.1 # +10% XP par jour consécutif (max 7 jours)
    event_multiplier: 2 # Double XP pendant les événements

  # Limites anti-spam
  limits:
    max_xp_per_day: 5000 # Maximum d'XP par jour
    max_messages_per_minute: 5 # Ignorer après X messages par minute

  # Récompenses de niveau (à personnaliser selon vos rôles)
  level_roles:
    5: "Membre Actif"
    10: "Membre Dévoué"
    20: "Vétéran"
    30: "Légende"
    50: "Dieu du serveur"
  # Si false, les rôles sont retirés quand le niveau n'est plus atteint
  level_roles_cumulable: true

  # Annonce de level-up (Phase 2)
  level_up:
    enabled: true
    channel_id: null          # null = salon courant, ou ID de salon dédié
    template: "🎉 Bravo {user} ! Tu passes au **niveau {level}** !"
    color: "#f2c7ce"
    ping_user: true            # mentionne l'utilisateur dans l'annonce
    show_rank: true            # affiche le rang dans le leaderboard
    show_total_xp: true        # affiche le total d'XP
    dm_user: false             # envoie aussi un DM à l'utilisateur

# ==============================================================================
# CONFIGURATION DU JEU DU COMPTEUR (ROUTE DE L'INFINI)
# ==============================================================================
counter:
  enabled: true
  channel_id: "votre_salon_compteur_id"
  max_errors: 1 # Nombre d'erreurs autorisées avant réinitialisation du compteur (défaut: 1)
  emojis:
    obsybon_id: "1524104068514189422"
    obsydemon_id: "1488145689916473544"
  messages:
    double_post_message: "<@{userId}>, **vous ne pouvez pas partager deux nombres à la suite** <:Obsydemoncouverture:{emojiObsydemon}>"
    warning_message: "⚠️ <@{userId}> s'est trompé(e) ! (**{errorsCount}/{maxErrors} erreurs** tolérées). Le nombre attendu reste **{expectedNumber}**."
    ranking_header: "**<@{userId}> a ruiné la Route de l'Infini après {maxErrors} erreur(s) !** \n\n 🏆 **Classement de la Route de l'Infini**\n"
    ranking_footer: "\n\nLe compteur a été réinitialisé, le prochain nombre est 1."
    no_participation: "Aucune participation enregistrée pour cette session."
    embed_title: "❌ Perdu !"
    embed_color: "#F2C7CE"

# ==============================================================================
# CONFIGURATION DU JEU DU COMPTE À REBOURS (COUNTDOWN)
# ==============================================================================
countdown:
  enabled: true
  channel_id: "votre_salon_countdown_id"
  start_number: 900
  max_errors: 1 # Nombre d'erreurs autorisées avant réinitialisation du compte à rebours (défaut: 1)
  trap_chance: 0.15 # ~15% de chance d'activer un piège
  emojis:
    obsybon_id: "1524104068514189422"
    obsydemon_id: "1488145689916473544"
  messages:
    start_message: "**Allez la chienne commence :** {number}"
    double_post_message: "<@{userId}>, **vous ne pouvez pas partager deux nombres à la suite** <:Obsydemoncouverture:{emojiObsydemon}>"
    trap_dodge_message: "**J’ai cru que j’allais vous avoir <:Obsydemoncouverture:{emojiObsydemon}>**"
    trap_failed_message: "<@{userId}>**, Je t’ai eu !** (**{errorsCount}/{maxErrors} erreurs** tolérées) <:Obsydemoncouverture:{emojiObsydemon}>. Le prochain nombre attendu est **{expectedNumber}**."
    finish_message: "**Je suis émue, vous ne vous êtes pas trompés mais ce n’est pas fini <:Obsydemoncouverture:{emojiObsydemon}>**"
    warning_message: "⚠️ <@{userId}> s'est trompé(e) ! (**{errorsCount}/{maxErrors} erreurs** tolérées). Le prochain nombre attendu est **{expectedNumber}**."
    error_message: "**Oups <@{userId}> s'est trompé(e), je vais devoir mordre ** <:Obsydemoncouverture:{emojiObsydemon}>"
    no_participation: "Aucune participation enregistrée."
    embed_title: "🏆 **Classement de la partie**"
    embed_color: "#F2C7CE"

# ==============================================================================
# CONFIGURATION DES RAPPELS DE BUMP DISBOARD
# ==============================================================================
bump_reminder:
  enabled: true # Activer ou désactiver le rappel de bump automatique
  channel_id: "" # Salon où envoyer les rappels (laisser vide "" pour utiliser le salon du bump)
  role_id: "" # Rôle à ping (ex: "123456789012345678"). Si vide, @here sera mentionné
  mention_here: true # Mentionner @here en fallback si role_id est vide
  reminder_cooldown_hours: 2 # Délai en heures entre deux bumps (2h pour Disboard)
  use_embed: false # Envoyer sous forme de message simple (false) ou d'embed Discord (true)
  # Message simple par défaut (Variables: {role}, {server}, {user}, {last_user}, {username}, {command}, {channel}, {hours})
  message: "{role} c'est l'heure de bumper {server} <:Obsydemoncouverture:1488145689916473544> (Dernier bump par {user})"
  # Options supplémentaires si use_embed est activé (optionnel)
  # Personnalisation des messages et de l'embed Discord
  # Variables disponibles :
  #   - {hours}    : Nombre d'heures de cooldown (ex: 2)
  #   - {role}     : Mention du rôle configuré ou @here
  #   - {user}     : Mention du dernier membre ayant bumpé (<@id>)
  #   - {username} : Pseudo du dernier membre ayant bumpé
  #   - {command}  : Raccourci Discord vers la commande </bump:947088344167366698>
  #   - {channel}  : Salon où le bump a eu lieu
  #   - {server}   : Nom du serveur Discord
  messages:
    content: "{role}"
    title: "⏰ C'est l'heure du Bump !"
    description: "{role} c'est l'heure de bumper {server} <:Obsydemoncouverture:1488145689916473544> !\n(Dernier bump par {user})"
    color: "#f2c7ce"
    footer: "Disboard Auto-Reminder"
    thumbnail: null # URL d'une vignette (optionnel)
    image: null # URL d'une bannière (optionnel)

# ==============================================================================
# CONFIGURATION DES FEATURES (Phase 0+) — Registre central
# ==============================================================================
# Cette section surcharge les blocs legacy ci-dessus. Priorité :
#   1. Table `feature_flags` (gérée via le dashboard /api/features)
#   2. Bloc `features.*` ci-dessous
#   3. Bloc legacy (`xp:`, `welcome:`...) au top-level
#   4. Defaults définis dans le code
#
# Utilisez `node scripts/migrate-config-to-features.js --apply` pour
# recopier la config legacy dans la table feature_flags.
features:
  # Système d'XP & niveaux
  xp:
    enabled: false
    allowed_roles: []
  # Message de bienvenue + auto-rôles
  welcome:
    enabled: false
    allowed_roles: []
  # Message du jour (IA)
  daily_message:
    enabled: false
    allowed_roles: []
  # Compteur (Route de l'Infini)
  counter:
    enabled: false
    allowed_roles: []
  # Countdown
  countdown:
    enabled: false
    allowed_roles: []
  # Rappel de bump
  bump_reminder:
    enabled: false
    allowed_roles: []
  # Captcha
  captcha:
    enabled: false
    allowed_roles: []
  # Modération automatique (Phase 1 — à venir)
  automod:
    enabled: false
    allowed_roles: []
  # Tickets (Phase 3 — à venir)
  tickets:
    enabled: false
    allowed_roles: []
  # Logs (Phase 4 — à venir)
  logs:
    enabled: false
    allowed_roles: []
  # Giveaways (Phase 5 — à venir)
  giveaways:
    enabled: false
    allowed_roles: []
  # Sondages (Phase 5 — à venir)
  polls:
    enabled: false
    allowed_roles: []

# ==============================================================================
# CONFIGURATION DE LA MODÉRATION AUTOMATIQUE (Phase 1)
# ==============================================================================
# Activer cette feature via le dashboard : http://localhost:3000/features
# ou directement ici : features.automod.enabled = true
#
# Note : le bloc `automod:` au top-level est conservé pour la rétrocompatibilité.
# Le bloc `features.automod:` ci-dessus a la priorité.
automod:
  enabled: false
  allowed_roles: [] # IDs des rôles autorisés à utiliser /mod-* (vide = perm Discord)

  # Anti-spam (rate + mentions)
  spam:
    enabled: true
    max_messages: 5
    window_seconds: 5
    max_mentions: 3
    mentions_window_seconds: 10
    action: warn

  # Bad-words (mots interdits)
  badwords:
    enabled: true
    list: []
    case_sensitive: false
    whole_word: true
    action: delete_warn

  # Anti-raid
  anti_raid:
    enabled: true
    join_threshold: 8
    window_seconds: 30
    action: alert
    lock_duration_seconds: 300

  # Anti-invite Discord
  anti_invite:
    enabled: true
    whitelist_guilds: []
    action: delete_warn

  # Anti-liens externes
  anti_link:
    enabled: false
    whitelist_domains: ["github.com", "discord.com"]
    action: delete

  # Anti-mass-mention
  mass_mention:
    enabled: true
    threshold: 5
    action: delete_warn

  # Anti-majuscules
  anti_caps:
    enabled: false
    min_length: 10
    caps_ratio: 0.7
    action: delete_warn

  # Sanctions progressives
  sanctions:
    warn_expire_days: 30
    progression:
      - { warnings: 3,  action: mute,   duration: "1h" }
      - { warnings: 5,  action: mute,   duration: "24h" }
      - { warnings: 7,  action: kick }
      - { warnings: 10, action: ban }

  log_channel_id: null
  dm_on_action: true

# ==============================================================================
# CONFIGURATION DES TICKETS DE SUPPORT (Phase 3)
# ==============================================================================
# Système de tickets avec bouton persistant, modal de création,
# claim/unclaim/close par le staff, transcripts HTML en BDD.
#
# Activer via le dashboard /features ou features.tickets.enabled = true
tickets:
  enabled: false
  allowed_roles: [] # Rôles autorisés à gérer les tickets (vide = perm Discord)

  panel:
    channel_id: null            # Salon où le panel est posté (ex: #support)
    title: "📩 Support"
    description: "Clique sur le bouton ci-dessous pour ouvrir un ticket. Notre staff te répondra dès que possible."
    color: "#5865F2"
    button_label: "Ouvrir un ticket"
    button_emoji: "📩"
    image: null

  categories:
    - id: support
      label: "Support"
      emoji: "❓"
      description: "Question ou problème général"
      staff_roles: []
    - id: report
      label: "Signalement"
      emoji: "🚨"
      description: "Signaler un membre ou un message"
      staff_roles: []
    - id: partner
      label: "Partenariat"
      emoji: "🤝"
      description: "Proposition de partenariat"
      staff_roles: []

  use_threads: false   # true = threads privés (limités 90j), false = salons dédiés

  settings:
    max_open_per_user: 3
    auto_close_after_days: 7
    transcript_channel_id: null  # Salon où poster les transcripts
    ping_staff_on_open: true
    staff_role_to_ping: null     # ID du rôle staff à mentionner
    log_channel_id: null
    close_message: "🔒 Ce ticket a été fermé par {closer}."
    reopen_on_message: false
    allow_user_close: false
    confirmation_before_close: true

  modal_fields:
    - { id: subject,     label: "Sujet",        style: "short",    required: true,  min_length: 3,   max_length: 100 }
    - { id: description, label: "Description",  style: "paragraph", required: true,  min_length: 20,  max_length: 1500 }

# ==============================================================================
# CONFIGURATION DES LOGS & STATISTIQUES (Phase 4)
# ==============================================================================
# Logs paramétrables par type d'event, avec dashboard /logs
# (KPIs + live feed WebSocket sur /ws/logs).
#
# Activer via le dashboard /features ou features.logs.enabled = true
logs:
  enabled: false
  allowed_roles: []

  # Canaux Discord où poster les embeds (null = BDD uniquement)
  channels:
    moderation: null    # bannissements
    messages: null      # delete / edit / bulk delete
    members: null       # join / leave / update / ban
    voice: null         # voice_state_update
    roles: null         # role create/update/delete
    channels_log: null  # channel create/update/delete
    server: null        # guild_update + emoji create/delete

  # Activer / désactiver chaque event individuellement
  events:
    message_delete: true
    message_edit: true
    message_bulk_delete: true
    member_join: true
    member_leave: true
    member_update: true
    member_ban_add: true
    member_ban_remove: true
    role_create: true
    role_update: true
    role_delete: true
    channel_create: true
    channel_update: true
    channel_delete: true
    voice_state_update: true
    guild_update: true
    emoji_create: true
    emoji_delete: true

  format: embed
  color: "#2F3136"

  # Salons / utilisateurs à ignorer (utile pour les salons de logs internes)
  ignored_channels: []
  ignored_users: []

  # Domaines dont les URLs ne seront PAS masquées par le Sanitizer
  whitelist_domains:
    - discord.com
    - discord.gg
    - github.com

  settings:
    max_content_length: 1024
    truncate_attachments: true
    live_feed_emit: true

