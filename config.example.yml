db_path: ./data/bot.db
web:
  port: 3000
  node_env: production
  auth:
    enabled: false
    api_key: changez_cette_cle_secrete
    protect_static: false
    allowed_ips: []
port: 3000
node_env: production
scheduler:
  enabled: true
  timezone: Europe/Paris
  tasks:
    bump_reminders:
      enabled: true
      cron: '* * * * *'
    daily_preview:
      enabled: true
      cron: 0 21 * * *
    daily_publish:
      enabled: true
      cron: 0 9 * * *
    daily_autovalidate:
      enabled: true
      cron: 0 11 * * *
openrouter:
  api_key: votre_cle_openrouter_ici
  default_model: openai/gpt-oss-20b:free
  max_tokens: 500
  temperature: 0.7
  fallback_models:
    - openai/gpt-oss-20b:free
    - meta-llama/llama-3.3-70b-instruct:free
    - google/gemini-2.0-flash-exp:free
    - mistralai/mistral-7b-instruct:free
    - qwen/qwen-2.5-72b-instruct:free
    - deepseek/deepseek-chat:free
    - nvidia/nemotron-3-ultra-550b-a55b:free
  retry_policy:
    enabled: true
    max_retries: 3
    initial_delay_ms: 1000
    backoff_factor: 2
    max_delay_ms: 8000
    jitter: true
    timeout_ms: 25000
    retryable_statuses:
      - 408
      - 429
      - 500
      - 502
      - 503
      - 504
discord:
  token: votre_discord_token_ici
  client_id: votre_client_id_ici
  guild_id: votre_guild_id_ici
  default_color: couleur_du_bot_dans_le_salon
  commands:
    enabled: true
    allowed_roles: []
    allowed_users: []
    allowed_channels: []
    permissions:
      config:
        allowed_roles: []
        allowed_users: []
        allowed_channels:
          - votre_salon_reserver
      confirm_member:
        allowed_roles: []
        allowed_users: []
        allowed_channels: []
startup_notifier:
  enabled: true
  channel_id: votre_salon_reserver
  color: couleur_du_bot_dans_le_salon
  last_commit_sha: ''
  github:
    repo: sinteam-bot/chienne-bot
    token: ''
daily_message:
  enabled: true
  channel_id: votre_salon_message_du_jour
  color: couleur_du_bot_dans_le_salon
  preview_channel_id: votre_salon_preview_message_du_jour
  preview_color: couleur_du_bot_dans_le_salon
  ai_config:
    model: gpt-4o-mini
    temperature: 0.7
    max_tokens: 500
    prompt: 'Date : ${dateStr}. Objectif : souhaiter une bonne journée en ambiance petit déjeuner. Voici les mots à inclure dans le texte : ${pickRandom(ajoutMod, 2)}'
    instruction: 'Écris uniquement le message final. Commence les message par ''En ce '' suivi de la date du jour (exemple format : lundi 1 janvier 2025). Le message doit être clair et compréhensible de tous. Maximum 3 phrases sans emoji.'
    angle_humour:
      - observation du quotidien
      - energie du matin
      - bienveillance complice
    style_ecriture:
      - philosophique
      - familier chaleureux
    dispositif_narratif:
      - classique
    contrainte_legere:
      - 'interdire_les_mots: soleil'
      - pas_de_point_dexclamation
      - utiliser_une_image_concrete
      - aucune_reference_au_temps
      - aucun_pronom_personnel
    ajoutMod:
      - Petit déjeuner
      - ' boisson'
      - ' matin'
      - ' réconfortant'
      - ' motivation'
      - ' avec du pep’s'
      - ' le lever'
      - ' le lit'
      - ' doudou'
      - ' boire'
      - ' bol'
      - ' tasse'
      - ' verre'
      - ' coucher'
      - ' ambition'
      - ' sérénité'
      - ' tendresse'
      - ' chaleur'
      - ' café'
      - ' thé'
      - ' chocolat chaud'
      - ' confiance'
      - ' opportunité'
      - ' fraicheur'
      - ' oreiller'
      - ' couette'
      - ' cuisine'
      - ' tartine'
      - ' jus d’orange'
      - ' amour'
      - ' gorgée'
captcha:
  enabled: true
  channel_id: null
  captcha_log_channel: votre_salon_de_logs_captcha
  captcha_channel_name: ✅-verification-captcha
  color: couleur_du_bot_dans_le_salon
  verified_role_id: votre_role_verifie
  captcha_timeout: 10
  max_attempts: 3
  math_questions:
    min_number: 1
    max_number: 20
    operations:
      - +
      - '-'
      - '*'
    operation_weights:
      - +: 0.6
      - '-': 0.3
      - '*': 0.1
    messages:
      welcome_message: 'Bienvenue sur le serveur ! Pour accéder au reste du serveur, tu dois résoudre ce captcha :'
      captcha_question: Combien font {num1} {operator} {num2} ?
      instructions: 'Réponds avec le résultat **en chiffres** (exemple: 18) dans ce canal.'
      success_message: ✅ Bravo ! Ta réponse est correcte. Tu as maintenant accès au serveur !
      fail_message: Mauvaise réponse, tu n'as plus que {attempts} tentative(s) <:Obsydemoncouverture:1488145689916473544>.
      timeout_message: ⏰ Temps écoulé ! Le captcha a expiré. Veuillez réessayer en rejoignant à nouveau le serveur.
      max_attempts_message: ❌ Trop de tentatives incorrectes. Veuillez quitter et rejoindre le serveur pour réessayer.
      already_verified: ✅ Tu as déjà été vérifié !
    log_messages:
      captcha_created: 🔒 Captcha créé pour {username} ({userId})
      captcha_success: ✅ Captcha validé pour {username} ({userId})
      captcha_failed: ❌ Captcha échoué pour {username} ({userId}) - Tentative {attempt}/{max}
      captcha_timeout: ⏰ Captcha expiré pour {username} ({userId})
welcome:
  enabled: true
  LOG_TO_CONSOLE: true
  channel_id: votre_salon_accueil
  welcome_channel_name: votre_salon_accueil
  welcome_color: couleur_du_bot_dans_le_salon
  AUTO_ROLES: []
  welcome_message:
    enabled: true
    title: 🎉 Bienvenue sur {server} !
    description: |-
      Bienvenue {user} !

      Nous sommes ravis de t'accueillir parmi nous ! 🎊
    color: '#f2c7ce'
    footer: 'Membre #{memberCount}'
    thumbnail: user
    image: null
    fields:
      - name: 📚 Pour commencer
        value: |-
          • Lis les règles dans <#CHANNEL_REGLES_ID>
          • Présente-toi dans <#CHANNEL_PRESENTATION_ID>
          • N'hésite pas à poser des questions !
        inline: false
      - name: 🎮 Commandes utiles
        value: |-
          `/help` - Liste des commandes
          `/rank` - Voir ton niveau
        inline: true
  dm_message:
    enabled: true
    title: 👋 Bienvenue !
    description: |-
      Salut {username} !

      Bienvenue sur **{server}** ! Nous espérons que tu vas t'amuser avec nous. 😊
    color: '#f2c7ce'
    fields:
      - name: 💡 Conseil
        value: N'oublie pas de te présenter pour que la communauté apprenne à te connaître !
        inline: false
xp:
  enabled: false
  message_xp:
    min: 15
    max: 25
    cooldown: 10
  voice_xp:
    per_minute: 2
    check_interval: 5
    min_duration: 1
  level:
    base_xp: 100
    multiplier: 1.5
  bonus:
    daily_first_message: 50
    streak_multiplier: 1.1
    event_multiplier: 2
  limits:
    max_xp_per_day: 5000
    max_messages_per_minute: 5
  level_roles:
    '5': Membre Actif
    '10': Membre Dévoué
    '20': Vétéran
    '30': Légende
    '50': Dieu du serveur
counter:
  enabled: true
  channel_id: votre_salon_compteur_id
  max_errors: 1
  show_ranking: true
  emojis:
    obsybon_id: '1524104068514189422'
    obsydemon_id: '1488145689916473544'
  messages:
    start_message: '**Allez la chienne commence :** {number}'
    double_post_message: <@{userId}>, **tu ne peux pas partager deux nombres à la suite** <:Obsydemoncouverture:{emojiObsydemon}>
    trap_dodge_message: '**J’ai cru que j’allais vous avoir <:Obsydemoncouverture:{emojiObsydemon}>**'
    trap_failed_message: <@{userId}>**, Je t’ai eu ** (**{errorsCount}/{maxErrors} erreurs** tolérées) <:Obsydemoncouverture:{emojiObsydemon}>. Le prochain nombre attendu est **{expectedNumber}**.
    finish_message: '**Je suis émue, vous ne vous êtes pas trompés mais ce n’est pas fini** <:Obsydemoncouverture:{emojiObsydemon}>'
    warning_message: ⚠️ <@{userId}> s'est trompé(e) (**{errorsCount}/{maxErrors} erreurs** tolérées). Le prochain nombre attendu est **{expectedNumber}**.
    error_message: '**Oups <@{userId}> s''est trompé(e), je vais devoir mordre** <:Obsydemoncouverture:{emojiObsydemon}>'
    no_participation: Aucune participation enregistrée.
    ranking_header: |
      **<@{userId}> a ruiné la Route de l'Infini après {maxErrors} erreur(s) !** 

       🏆 **Classement de la Route de l'Infini**
    ranking_footer: Le compteur a été réinitialisé, le prochain nombre est 1.
    embed_title: ❌ Perdu !
    embed_color: '#F2C7CE'
countdown:
  enabled: true
  channel_id: votre_salon_countdown_id
  start_number: 900
  max_errors: 1
  trap_chance: 0.15
  show_ranking: true
  emojis:
    obsybon_id: '1524104068514189422'
    obsydemon_id: '1488145689916473544'
  messages:
    start_message: '**Allez la chienne commence :** {number}'
    double_post_message: <@{userId}>, **tu ne peux pas partager deux nombres à la suite** <:Obsydemoncouverture:{emojiObsydemon}>
    trap_dodge_message: '**J’ai cru que j’allais vous avoir <:Obsydemoncouverture:{emojiObsydemon}>**'
    trap_failed_message: <@{userId}>**, Je t’ai eu ** (**{errorsCount}/{maxErrors} erreurs** tolérées) <:Obsydemoncouverture:{emojiObsydemon}>. Le prochain nombre attendu est **{expectedNumber}**.
    finish_message: '**Je suis émue, vous ne vous êtes pas trompés mais ce n’est pas fini** <:Obsydemoncouverture:{emojiObsydemon}>'
    warning_message: ⚠️ <@{userId}> s'est trompé(e) (**{errorsCount}/{maxErrors} erreurs** tolérées). Le prochain nombre attendu est **{expectedNumber}**.
    error_message: '**Oups <@{userId}> s''est trompé(e), je vais devoir mordre** <:Obsydemoncouverture:{emojiObsydemon}>'
    no_participation: Aucune participation enregistrée.
